services:
  postgres:
    image: postgres:18-alpine
    container_name: ledger-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"
    volumes:
      - ledger_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ledger" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrator
    container_name: ledger-migrate
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/ledger?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      target: final
    container_name: ledger-server
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/ledger?sslmode=disable
      GRPC_PORT: 50051
      METRICS_PORT: 9090
      LOG_LEVEL: debug
      DATABASE_MAX_CONNS: 25
      DATABASE_MIN_CONNS: 5
      DATABASE_TIMEOUT: 5s
      SHUTDOWN_TIMEOUT: 30s
    ports:
      - "50051:50051"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: ledger-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ledger_promdata:/prometheus
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:11.6.15
    container_name: ledger-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ledger_grafanadata:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  ledger_data:
    driver: local
  ledger_promdata:
  ledger_grafanadata:
